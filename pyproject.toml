[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "medslot"
version = "0.1.0"
description = "Telegram appointment booking bot for a medical clinic"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.15,<2",
    "aiogram>=3.20,<4",
    "aiosqlite>=0.21,<1",
    "APScheduler>=3.10,<4",
    "pydantic-settings>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "SQLAlchemy[asyncio]>=2.0,<3",
    "tzdata>=2024.2,<2027",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/medslot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "C4", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
